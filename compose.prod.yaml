name: rebuild-loop-prod

services:
  web:
    image: ${REBUILD_WEB_IMAGE:?Set REBUILD_WEB_IMAGE to an immutable image tag}
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL:?Set APP_URL}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-rebuild-loop}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:?Set S3_INTERNAL_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_REGION: ${S3_REGION:-auto}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    ports:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    image: ${REBUILD_WORKER_IMAGE:?Set REBUILD_WORKER_IMAGE to an immutable image tag}
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-rebuild-loop}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:?Set S3_INTERNAL_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      WORKER_HEALTH_PORT: 3001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
